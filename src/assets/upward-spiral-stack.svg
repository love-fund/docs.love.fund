<circle r="6" fill="#1b1b1b"><animateMotion dur="6s" begin="0.0s" repeatCount="indefinite"><mpath href="#rise"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="6s" begin="0.0s" repeatCount="indefinite"/></circle>
<circle r="6" fill="#1b1b1b"><animateMotion dur="6s" begin="-1.5s" repeatCount="indefinite"><mpath href="#rise"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="6s" begin="-1.5s" repeatCount="indefinite"/></circle>
<circle r="6" fill="#1b1b1b"><animateMotion dur="6s" begin="-3.0s" repeatCount="indefinite"><mpath href="#rise"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="6s" begin="-3.0s" repeatCount="indefinite"/></circle>
<circle r="6" fill="#1b1b1b"><animateMotion dur="6s" begin="-4.5s" repeatCount="indefinite"><mpath href="#rise"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="6s" begin="-4.5s" repeatCount="indefinite"/></circle>
<text x="200" y="496" text-anchor="middle" font-size="13" font-weight="600" fill="#5f5b53">heal the dualism here…</text>
<text x="200" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#5f5b53">…and the momentum rises</text>
