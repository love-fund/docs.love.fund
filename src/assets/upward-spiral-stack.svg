<svg viewBox="0 0 560 520" width="560" height="520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Healing at each level lifts the next: individual, family, community, city, bioregion, nation, planet">
<rect width="560" height="520" rx="24" fill="#fffaf0"/>
<g font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#1b1b1b">
