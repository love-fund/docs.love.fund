<ellipse cx="200" cy="200" rx="126" ry="25.2" fill="none" stroke="#2d6cdf" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 7"><animate attributeName="stroke-dashoffset" from="0" to="-17" dur="3.8s" repeatCount="indefinite"/></ellipse>
<line x1="334" y1="200" x2="390" y2="200" stroke="#2d6cdf" stroke-width="1.5" stroke-dasharray="2 4"/>
